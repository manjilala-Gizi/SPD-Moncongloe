<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aplikasi SPD Puskesmas Moncongloe</title>
  <meta name="description" content="Pembuat SPD, Surat Tugas, Lembar Penerimaan, dan Lembar Verifikasi UPTD Puskesmas Moncongloe.">
  <meta name="theme-color" content="#1f5f4a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="merek">
        <img src="icons/logo-maros.png" alt="Logo Kabupaten Maros" width="44" height="41">
        <div>
          <strong>Aplikasi SPD Puskesmas Moncongloe</strong>
          <span>Kabupaten Maros</span>
        </div>
      </div>
      <nav class="menu" aria-label="Menu utama">
        <a class="menu-item" href="#/dashboard" data-menu="dashboard">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z"/></svg>Dashboard</a>
        <a class="menu-item" href="#/baru" data-menu="baru">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>Buat Kegiatan Baru</a>
        <a class="menu-item" href="#/kegiatan" data-menu="kegiatan">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>Daftar Kegiatan</a>
        <a class="menu-item" href="#/pegawai" data-menu="pegawai">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm-8 0a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5C15 14.2 10.3 13 8 13zm8 0c-.3 0-.6 0-1 .1 1.2.8 2 2 2 3.4V19h6v-2.5c0-2.3-4.7-3.5-7-3.5z"/></svg>Data Pegawai</a>
        <a class="menu-item" href="#/posyandu" data-menu="posyandu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 14.5 9 2.5 2.5 0 0 1 12 11.5z"/></svg>Data Posyandu</a>
        <a class="menu-item" href="#/pengaturan" data-menu="pengaturan">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1L11 21h4l.4-2.9a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 16.5 12 3.5 3.5 0 0 1 13 15.5z"/></svg>Pengaturan</a>
      </nav>
      <div class="sidebar-kaki">
        <div id="status-simpan" class="status-simpan"></div>
        <button id="btn-pasang" class="tombol tombol-hantu tombol-kecil" hidden>Pasang aplikasi</button>
        <p class="kredit">Developed by Manjilala-Poltekkes Kemenkes Makassar/Persagi Sulsel</p>
      </div>
    </aside>
    <div class="tirai" id="tirai"></div>

    <div class="utama">
      <header class="topbar">
        <button id="btn-menu" class="tombol-ikon" aria-label="Buka menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
        </button>
        <h1 id="judul-halaman">Dashboard</h1>
        <span id="status-jaringan" class="lencana" hidden>Offline</span>
      </header>
      <div id="banner" class="banner" hidden></div>
      <main id="isi" class="isi"></main>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <input type="file" id="input-impor" accept=".xlsx" hidden>

  <script src="js/vendor/xlsx.mini.min.js"></script>
  <script src="js/vendor/jszip.min.js"></script>
  <script src="js/spd-core.js"></script>
  <script src="js/config.js"></script>
  <script src="js/simpan.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
